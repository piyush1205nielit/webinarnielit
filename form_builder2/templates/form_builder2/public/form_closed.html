<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form unavailable</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef2ff,#f7f8fc);min-height:100vh;display:flex;
    align-items:center;justify-content:center;padding:24px;color:#1e2233}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:40px 32px;max-width:440px;

  .ic{width:70px;height:70px;border-radius:50%;background:#fef3c7;color:#d97706;font-size:2rem;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{color:#6b7280;margin:0}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">🔒</div>
    <h1>This form isn’t accepting responses</h1>
    <p>The form you’re looking for is currently unavailable. Please check back later.</p>
  </div>
</body>
</html>
