<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitted · {{ object.title }}</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef2ff,#f7f8fc);min-height:100vh;display:flex;
    align-items:center;justify-content:center;padding:24px;color:#1e2233}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:40px 32px;max-width:460px;
    text-align:center;box-shadow:0 12px 34px rgba(16,24,40,.1)}
  .tick{width:70px;height:70px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:2.2rem;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-size:1.4rem;margin:0 0 10px}
  p{color:#6b7280;margin:0 0 22px}
  .btn{display:inline-block;background:#4f46e5;color:#fff;padding:11px 20px;border-radius:10px;
    font-weight:600;text-decoration:none}
  .btn:hover{background:#4338ca}
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Response recorded</h1>
    <p>{{ object.success_message }}</p>
    {% if object.allow_multiple %}
      <a class="btn" href="{% url 'form_builder2:form_fill' object.slug %}">Submit another response</a>
    {% endif %}
  </div>
</body>
</html>
