{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Form Builder{% endblock %}</title>
<style>
  :root{
    --bg:#f4f5fb; --card:#ffffff; --ink:#1e2233; --muted:#6b7280;
    --brand:#4f46e5; --brand-dark:#4338ca; --line:#e5e7eb;
    --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
    --amber:#d97706; --amber-bg:#fef3c7; --radius:14px;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:var(--brand);text-decoration:none}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar-in{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
  .brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-block}
  .wrap{max-width:1180px;margin:24px auto;padding:0 20px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:1.5rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:20px}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;transition:.15s}
  .btn:hover{background:#f8fafc}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn-danger:hover{filter:brightness(.93)}
  .btn-sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
  .btn-ghost{background:transparent;border-color:transparent}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700}
  .badge-on{background:var(--green-bg);color:var(--green)}
  .badge-off{background:var(--amber-bg);color:var(--amber)}
  .badge-mut{background:#eef2ff;color:var(--brand)}

  /* Table */
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbff}
  tbody tr:hover{background:#fafbff}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}

  /* Forms */
  label{font-weight:600;font-size:.85rem;display:block;margin-bottom:5px}
  .inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.92rem;
    font-family:inherit;background:#fff;color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .field{margin-bottom:16px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .hint{color:var(--muted);font-size:.8rem;margin-top:4px}
  .errorlist{list-style:none;padding:0;margin:6px 0 0;color:var(--red);font-size:.82rem}

  /* Messages */
  .msg{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-weight:600;font-size:.88rem}
  .msg.success{background:var(--green-bg);color:var(--green)}
  .msg.error{background:var(--red-bg);color:var(--red)}
  .msg.info{background:#eef2ff;color:var(--brand)}

  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
  .stat{padding:16px}
  .stat .n{font-size:1.7rem;font-weight:800}
  .stat .l{color:var(--muted);font-size:.82rem}

  .url-pill{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;background:#f1f5f9;border:1px solid var(--line);
    padding:4px 8px;border-radius:8px;display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;vertical-align:middle}

  @media(max-width:720px){
    .grid-2,.grid-3{grid-template-columns:1fr}
    .page-head h1{font-size:1.25rem}
    .wrap{margin:16px auto}
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <a class="brand" href="{% url 'form_builder2:form_list' %}"><span class="dot"></span> Form Builder</a>
    <div>
      <a class="btn btn-primary btn-sm" href="{% url 'form_builder2:form_create' %}">+ New form</a>
    </div>
  </div>
</div>

<div class="wrap">
  {% if messages %}
    {% for m in messages %}
      <div class="msg {{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
